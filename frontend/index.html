<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceRec Portal</title>
    <style>
      :root { font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif; }
      body { margin: 0; background: #0b1320; color: #e7eefb; }
      header { display:flex; gap:1rem; align-items:center; padding: 1rem 1.5rem; border-bottom: 1px solid #1f2a44; position:sticky; top:0; background:#0b1320dd; backdrop-filter:saturate(1.3) blur(6px); }
      header h1 { font-size: 1.1rem; margin: 0; letter-spacing: .3px; }
      nav a { color: #a9c1ff; text-decoration: none; margin-right: 1rem; }
      nav a.active { color: white; font-weight: 600; }
      main { max-width: 1000px; margin: 0 auto; padding: 1.2rem; }
      .card { background: #111a2d; border: 1px solid #1f2a44; border-radius: 16px; padding: 1rem; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
      .row { display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-start; }
      .btn { background: #335cff; color:white; border:none; padding:.7rem 1rem; border-radius: 12px; cursor:pointer; font-weight:600; }
      .btn.secondary { background: #23325a; }
      .btn:disabled { opacity:.5; cursor:not-allowed; }
      label { display:block; margin:.4rem 0; color:#bcd0ff; }
      input[type="text"]{ width:100%; padding:.6rem .8rem; border-radius:10px; border:1px solid #2b3a63; background:#0f1830; color:#e7eefb;}
      .video-box { position:relative; background:#0f1830; border:1px dashed #2b3a63; border-radius:14px; }
      .video-box video, .video-box canvas { width:100%; max-width:640px; border-radius:14px; display:block; }
      .pill { background:#182648; padding:.3rem .6rem; border-radius:999px; font-size:.8rem; border:1px solid #2b3a63; color:#bcd0ff; }
      table { width:100%; border-collapse: collapse; }
      th, td { text-align:left; padding:.6rem .4rem; border-bottom:1px solid #1f2a44; }
      .muted { color:#90a3c6; }
      footer { text-align:center; color:#90a3c6; padding: 1rem 0 2rem; }
      .progress { height:10px; background:#0f1830; border-radius:999px; border:1px solid #2b3a63; overflow:hidden; }
      .progress > div { height:100%; background:#4b6bff; width:0%; transition: width .2s ease; }
      .candidates { display:flex; flex-direction:column; gap:.5rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
